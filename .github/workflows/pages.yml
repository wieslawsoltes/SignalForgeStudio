name: Test and publish GitHub Pages
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: read
concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: false
jobs:
  check:
    name: Test browser app and relay core
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24'
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm test
      - name: Validate JavaScript syntax
        run: find app relay scripts -type f \( -name '*.js' -o -name '*.mjs' \) -print0 | xargs -0 -n1 node --check
      - run: npm run build:pages
      - name: Install browser test tools
        run: |
          python3 -m pip install --disable-pip-version-check playwright==1.62.0
          python3 -m playwright install --with-deps chromium
      - name: Exercise WebGPU and Canvas under the Pages subpath
        run: python3 tests/pages_browser.py
      - name: Summarize browser checks
        if: success()
        run: |
          echo '### Static-hosting browser checks' >> "$GITHUB_STEP_SUMMARY"
          echo '```json' >> "$GITHUB_STEP_SUMMARY"
          cat tests/artifacts/pages/results.json >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
      - name: Identify Pages configuration
        if: github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api "repos/$GITHUB_REPOSITORY/pages" --jq '{build_type,source,html_url,status}'
      - name: Stamp source revision
        run: printf '{"commit":"%s"}\n' "$GITHUB_SHA" > dist/version.json
      - uses: actions/upload-pages-artifact@7b1f4a764d45c48632c6b24a0339c27f5614fb0b # v4
        with:
          path: dist
  publish:
    name: Publish verified browser app
    needs: check
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    permissions:
      pages: write
      id-token: write
    steps:
      - name: Deploy GitHub Pages artifact
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
      - name: Verify published version and browser resources
        env:
          SITE_URL: https://wieslawsoltes.github.io/SignalForgeStudio/
        run: |
          python3 - <<'PY'
          import json, os, time, urllib.request
          base, commit = os.environ['SITE_URL'], os.environ['GITHUB_SHA']
          deadline = time.monotonic() + 360
          while True:
              try:
                  with urllib.request.urlopen(base + 'version.json?commit=' + commit, timeout=20) as r:
                      assert json.load(r)['commit'] == commit
                  break
              except Exception:
                  if time.monotonic() >= deadline:
                      raise
                  time.sleep(10)
          for path in ('', 'app.js', 'style.css', 'core/renderer-gpu.js', 'core/audio-worklet.js'):
              with urllib.request.urlopen(base + path, timeout=30) as r:
                  body = r.read()
                  assert r.status == 200 and body, path
                  if not path:
                      assert b'content="static"' in body and b'SignalForge' in body
          print('Verified live deployment:', base, commit)
          with open(os.environ['GITHUB_STEP_SUMMARY'], 'a') as summary:
              summary.write(f'### Published\n{base}\n\nSource commit: `{commit}`\n')
          PY
