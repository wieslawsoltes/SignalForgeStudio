name: Import verified SignalForge source
on:
  push:
    branches: [main]
    paths: ['.import/**', '.github/workflows/import.yml']
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: source-import
  cancel-in-progress: false
jobs:
  import:
    if: github.repository == 'wieslawsoltes/SignalForgeStudio'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24'
      - name: Verify and extract source
        shell: bash
        run: |
          set -euo pipefail
          cat .import/source.part-* > "$RUNNER_TEMP/source.tar.xz"
          echo "0a7d425f44ec6570ab4072c71a86fce23f7ca6c8b22a80de015b47511afcba9c  $RUNNER_TEMP/source.tar.xz" | sha256sum --check --strict
          python3 - <<'PY'
          import os, pathlib, tarfile
          archive = pathlib.Path(os.environ['RUNNER_TEMP']) / 'source.tar.xz'
          with tarfile.open(archive, 'r:xz') as tar:
              members = tar.getmembers()
              assert len(members) == 41, 'Unexpected source file count'
              assert sum(m.size for m in members) < 500_000, 'Unexpected source size'
              for member in members:
                  path = pathlib.PurePosixPath(member.name)
                  assert member.isfile() and not path.is_absolute()
                  assert '..' not in path.parts
                  assert path.parts[0] not in {'.git', '.github', '.import'}
              tar.extractall('.', members=members, filter='data')
          PY
      - name: Lock dependencies and verify project
        run: |
          npm install --package-lock-only --ignore-scripts
          npm ci --ignore-scripts
          npm test
          npm run build:pages
      - name: Commit complete source
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm -r .import
          git add .editorconfig .gitignore LICENSE README.md THIRD_PARTY.md package.json package-lock.json app docs relay scripts tests
          git commit -m 'Add complete SignalForge Studio source, relay, tests, and Pages build'
          git push origin HEAD:main
      - name: Stage initial static site commit
        shell: bash
        run: |
          set -euo pipefail
          ROOT="$PWD"
          export GIT_INDEX_FILE="$RUNNER_TEMP/pages.index"
          rm -f "$GIT_INDEX_FILE"
          git -C dist --git-dir="$ROOT/.git" --work-tree="$ROOT/dist" add --all
          TREE=$(git write-tree)
          SHA=$(printf 'Build SignalForge Studio static site\n' | git commit-tree "$TREE" -p HEAD)
          git push origin "$SHA:refs/heads/pages-staging"
          echo "PAGES_COMMIT=$SHA"
          echo "Source commit: $(git rev-parse HEAD)" >> "$GITHUB_STEP_SUMMARY"
          echo "Static-site commit: $SHA" >> "$GITHUB_STEP_SUMMARY"
